<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', monospace">
  <defs>
    <style>
      .box { fill: #1c1c1c; stroke: #2e2e2c; stroke-width: 1.5; rx: 8; }
      .box-accent { fill: #1c1c1c; stroke: #f2874a; stroke-width: 1.5; rx: 8; }
      .label { fill: #e9e7e2; font-size: 15px; font-weight: 500; }
      .sublabel { fill: #8c8a85; font-size: 11px; }
      .arrow { stroke: #8c8a85; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-accent { stroke: #f2874a; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-accent); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8c8a85"/>
    </marker>
    <marker id="arrowhead-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f2874a"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#141414"/>

  <!-- Client -->
  <rect class="box" x="30" y="180" width="150" height="60" rx="8"/>
  <text class="label" x="105" y="205" text-anchor="middle">Web UI /</text>
  <text class="label" x="105" y="222" text-anchor="middle">API client</text>

  <!-- API -->
  <rect class="box-accent" x="250" y="170" width="170" height="80" rx="8"/>
  <text class="label" x="335" y="200" text-anchor="middle">FastAPI</text>
  <text class="sublabel" x="335" y="218" text-anchor="middle">auth · rate limit</text>
  <text class="sublabel" x="335" y="233" text-anchor="middle">(this repo)</text>

  <!-- llama-server -->
  <rect class="box" x="500" y="170" width="180" height="80" rx="8"/>
  <text class="label" x="590" y="200" text-anchor="middle">llama-server</text>
  <text class="sublabel" x="590" y="218" text-anchor="middle">llama.cpp</text>
  <text class="sublabel" x="590" y="233" text-anchor="middle">Llama 3.1 8B GGUF</text>

  <!-- RAG layer -->
  <rect class="box" x="270" y="320" width="220" height="70" rx="8"/>
  <text class="label" x="380" y="348" text-anchor="middle">RAG layer</text>
  <text class="sublabel" x="380" y="365" text-anchor="middle">local vectors + web search</text>
  <text class="sublabel" x="380" y="379" text-anchor="middle">(optional, opt-in per request)</text>

  <!-- Arrows -->
  <path class="arrow" d="M180,210 L250,210"/>
  <path class="arrow" d="M420,210 L500,210"/>
  <path class="arrow-accent" d="M335,250 L335,320"/>

  <!-- caption -->
  <text class="sublabel" x="450" y="30" text-anchor="middle" font-size="13">Everything below runs on your own hardware. No prompts or responses leave the machine.</text>
</svg>
