services:
  llama-server:
    build:
      context: .
      dockerfile: docker/llama-server.Dockerfile
    container_name: anvilllm-llama-server
    volumes:
      - ./models:/models
    command:
      - --model
      - /models/${MODEL_FILENAME:-llama-3.1-8b-instruct.Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --ctx-size
      - "${CONTEXT_SIZE:-8192}"
    expose:
      - "8081"   # internal only - reachable from the api service, not the host
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anvilllm-api
    env_file:
      - .env
    environment:
      - LLAMA_SERVER_HOST=llama-server
      - LLAMA_SERVER_PORT=8081
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - llama-server
    restart: unless-stopped

